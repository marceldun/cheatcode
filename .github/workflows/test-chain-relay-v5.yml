name: Test two-host relay chain v5

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - install_chain_relay_v5.sh
      - .github/workflows/test-chain-relay-v5.yml

permissions:
  contents: write

jobs:
  real-two-host-orchestration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Static checks
        run: |
          bash -n install_chain_relay_v5.sh
          shellcheck -x -S warning install_chain_relay_v5.sh
      - name: Prepare isolated SSH target and occupied relay ports
        run: |
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y openssh-server >/dev/null
          sudo mkdir -p /run/sshd /root/.ssh
          sudo chmod 700 /root/.ssh
          sudo ssh-keygen -q -t ed25519 -N '' -f /root/.ssh/id_ed25519
          sudo sh -c 'cat /root/.ssh/id_ed25519.pub >> /root/.ssh/authorized_keys'
          sudo chmod 600 /root/.ssh/authorized_keys
          sudo /usr/sbin/sshd -p 2222
          cat >/tmp/block-v5.py <<'PY'
          import socket, time
          tcp=socket.socket(); tcp.setsockopt(socket.SOL_SOCKET,socket.SO_REUSEADDR,1); tcp.bind(('0.0.0.0',26444)); tcp.listen(2)
          udp=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); udp.bind(('0.0.0.0',26443))
          time.sleep(1500)
          PY
          sudo python3 /tmp/block-v5.py >/tmp/block-v5.log 2>&1 &
          echo $! >/tmp/block-v5.pid
          sudo mkdir -p /etc/sing-box
          echo 'existing-service-must-remain' | sudo tee /etc/sing-box/original-marker >/dev/null
      - name: Run the same one-command controller path
        run: |
          set +e
          sudo env \
            ROLE=controller \
            WORK_DIR=/etc/chain-v5-test-exit \
            SERVICE_NAME=chain-v5-test-exit \
            EXIT_HY2_PORT=25443 \
            EXIT_REALITY_PORT=25444 \
            EXIT_IP=127.0.0.1 \
            RELAY_LOGIN=root@127.0.0.1 \
            RELAY_SSH_PORT=2222 \
            REMOTE_WORK_DIR=/etc/chain-v5-test-relay \
            REMOTE_SERVICE_NAME=chain-v5-test-relay \
            RELAY_HY2_PORT=26443 \
            RELAY_REALITY_PORT=26444 \
            RELAY_PUBLIC_IP=127.0.0.1 \
            MEM_KB_OVERRIDE=262144 \
            bash install_chain_relay_v5.sh >/tmp/v5-controller.log 2>&1
          echo $? >/tmp/v5-controller.rc
          exit 0
      - name: Verify both hosts, forced conflicts, DNS and real chain
        run: |
          set +e
          report=/tmp/chain-v5-test-report.txt
          : > "$report"
          failed=0
          controller_rc=$(cat /tmp/v5-controller.rc)
          echo "one_command_controller=$controller_rc" >> "$report"; [ "$controller_rc" -eq 0 ] || failed=1
          sudo systemctl is-active --quiet chain-v5-test-exit
          rc=$?; echo "exit_service_active=$rc" >> "$report"; [ "$rc" -eq 0 ] || failed=1
          sudo systemctl is-active --quiet chain-v5-test-relay
          rc=$?; echo "relay_service_active=$rc" >> "$report"; [ "$rc" -eq 0 ] || failed=1
          sudo /etc/chain-v5-test-exit/sing-box check -c /etc/chain-v5-test-exit/config.json
          rc=$?; echo "exit_official_config_check=$rc" >> "$report"; [ "$rc" -eq 0 ] || failed=1
          sudo /etc/chain-v5-test-relay/sing-box check -c /etc/chain-v5-test-relay/config.json
          rc=$?; echo "relay_official_config_check=$rc" >> "$report"; [ "$rc" -eq 0 ] || failed=1
          strategy=$(sudo jq -r '.dns.strategy' /etc/chain-v5-test-exit/config.json)
          [ "$strategy" = ipv4_only ]; rc=$?; echo "exit_ipv4_only_dns=$rc" >> "$report"; [ "$rc" -eq 0 ] || failed=1
          users=$(sudo jq '.inbounds[]|select(.type=="hysteria2")|.users|length' /etc/chain-v5-test-exit/config.json)
          [ "$users" -eq 2 ]; rc=$?; echo "exit_direct_and_relay_users=$rc" >> "$report"; [ "$rc" -eq 0 ] || failed=1
          final=$(sudo jq -r '.route.final' /etc/chain-v5-test-relay/config.json)
          [ "$final" = chain-to-domainesia ]; rc=$?; echo "relay_forces_domainesia_exit=$rc" >> "$report"; [ "$rc" -eq 0 ] || failed=1
          hport=$(sudo jq -r '.inbounds[]|select(.type=="hysteria2")|.listen_port' /etc/chain-v5-test-relay/config.json)
          rport=$(sudo jq -r '.inbounds[]|select(.type=="vless")|.listen_port' /etc/chain-v5-test-relay/config.json)
          [ "$hport" != 26443 ] && [ "$rport" != 26444 ]; rc=$?; echo "relay_occupied_ports_auto_avoided=$rc" >> "$report"; [ "$rc" -eq 0 ] || failed=1
          sudo grep -q '^existing-service-must-remain$' /etc/sing-box/original-marker
          rc=$?; echo "existing_relay_files_preserved=$rc" >> "$report"; [ "$rc" -eq 0 ] || failed=1
          sudo grep -q '两跳真实联网测试通过' /root/chain-v5-relay-deploy-result.txt
          rc=$?; echo "full_two_hop_real_network=$rc" >> "$report"; [ "$rc" -eq 0 ] || failed=1
          grep '真实联网通过' /tmp/v5-controller.log | sed -r 's/\x1B\[[0-9;]*[mK]//g' >> "$report" || true
          if [ "$failed" -eq 0 ]; then echo result=PASS >> "$report"; else
            echo result=FAIL >> "$report"
            echo controller_log_tail: >> "$report"
            tail -100 /tmp/v5-controller.log >> "$report"
          fi
      - name: Publish machine-readable report
        if: always()
        run: |
          cp /tmp/chain-v5-test-report.txt /tmp/TEST_REPORT.txt
          git config user.name github-actions
          git config user.email github-actions@github.com
          git checkout --orphan chain-v5-test-report
          git rm -rf .
          cp /tmp/TEST_REPORT.txt TEST_REPORT.txt
          git add TEST_REPORT.txt
          git commit -m "Chain v5 test report $GITHUB_SHA"
          git push --force origin HEAD:chain-v5-test-report
      - name: Set final result
        if: always()
        run: grep -q '^result=PASS$' /tmp/chain-v5-test-report.txt
