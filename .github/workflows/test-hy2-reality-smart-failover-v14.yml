name: Test HY2-first REALITY failover v14
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - install_hy2_reality_smart_failover_v14.sh
      - .github/workflows/test-hy2-reality-smart-failover-v14.yml
permissions:
  contents: read
jobs:
  complete-install-and-real-failover:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Static checks
        run: |
          bash -n install_hy2_reality_smart_failover_v14.sh
          shellcheck -x -S error install_hy2_reality_smart_failover_v14.sh
          grep -q '"type":"fallback"' install_hy2_reality_smart_failover_v14.sh
          grep -q '"HY2-PRIMARY","REALITY-BACKUP"' install_hy2_reality_smart_failover_v14.sh
      - name: Install complete v14 from zero
        run: |
          set +e
          sudo SMART_V14_WORKER=1 bash install_hy2_reality_smart_failover_v14.sh >/tmp/v14.log 2>&1
          echo $? >/tmp/v14.rc
          exit 0
      - name: Validate three server services
        run: |
          test "$(cat /tmp/v14.rc)" = 0 || { tail -300 /tmp/v14.log; exit 1; }
          sudo systemctl is-active --quiet sing-box
          sudo systemctl is-active --quiet xray-reality-v13
          sudo systemctl is-active --quiet reality-v13-brutal
      - name: Validate permanent removal of restart probes
        run: |
          ! systemctl list-timers --all --no-legend | grep -q sb-fast-health
          for v in v5 v6 v7 v8; do
            test "$(readlink /etc/systemd/system/sb-fast-health-$v.timer)" = /dev/null
            test "$(readlink /etc/systemd/system/sb-fast-health-$v.service)" = /dev/null
          done
      - name: Prepare generated fallback configuration
        run: |
          sudo jq '(.proxies[].server)="127.0.0.1"' /etc/hy2-reality-smart-v14/mihomo-hy2-first-failover.yaml >/tmp/failover.yaml
          jq -e '."proxy-groups"[0].type=="fallback"' /tmp/failover.yaml
      - name: Validate generated configuration with real Mihomo core
        run: |
          docker run --rm --network host -v /tmp/failover.yaml:/root/.config/mihomo/config.yaml:ro metacubex/mihomo:latest -t
      - name: Prove HY2 is initially selected
        run: |
          docker run -d --name mihomo-v14 --network host -v /tmp/failover.yaml:/root/.config/mihomo/config.yaml:ro metacubex/mihomo:latest
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:9090/version >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS 'http://127.0.0.1:9090/proxies/REALITY-BACKUP/delay?url=https%3A%2F%2Fwww.gstatic.com%2Fgenerate_204&timeout=10000' | jq -e '.delay>0'
          selected(){ curl -fsS http://127.0.0.1:9090/proxies/SMART-AUTO | jq -r .now; }
          wait_for(){ expected=$1; for i in $(seq 1 20); do [ "$(selected 2>/dev/null || true)" = "$expected" ] && return 0; sleep 2; done; return 1; }
          wait_for HY2-PRIMARY || { docker logs mihomo-v14; exit 1; }
          echo initial=HY2-PRIMARY
      - name: Prove REALITY takes over when HY2 stops
        run: |
          selected(){ curl -fsS http://127.0.0.1:9090/proxies/SMART-AUTO | jq -r .now; }
          wait_for(){ expected=$1; for i in $(seq 1 20); do [ "$(selected 2>/dev/null || true)" = "$expected" ] && return 0; sleep 2; done; return 1; }
          sudo systemctl stop sing-box
          wait_for REALITY-BACKUP || { docker logs mihomo-v14; exit 1; }
          echo after_hy2_failure=REALITY-BACKUP
          code=$(curl --noproxy '' -sS -o /dev/null -w '%{http_code}' --socks5-hostname 127.0.0.1:2080 --max-time 20 https://www.gstatic.com/generate_204)
          test "$code" = 204
      - name: Prove automatic failback after HY2 recovers
        run: |
          selected(){ curl -fsS http://127.0.0.1:9090/proxies/SMART-AUTO | jq -r .now; }
          wait_for(){ expected=$1; for i in $(seq 1 20); do [ "$(selected 2>/dev/null || true)" = "$expected" ] && return 0; sleep 2; done; return 1; }
          sudo systemctl start sing-box
          wait_for HY2-PRIMARY || { docker logs mihomo-v14; exit 1; }
          echo after_hy2_recovery=HY2-PRIMARY
          code=$(curl --noproxy '' -sS -o /dev/null -w '%{http_code}' --socks5-hostname 127.0.0.1:2080 --max-time 20 https://www.gstatic.com/generate_204)
          test "$code" = 204
          echo result=PASS
      - name: Clean test client
        if: always()
        run: docker rm -f mihomo-v14 >/dev/null 2>&1 || true
