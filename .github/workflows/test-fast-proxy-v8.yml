name: Test HY2 v8 without external restart probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - install_fast_proxy_v8.sh
      - .github/workflows/test-fast-proxy-v8.yml
permissions:
  contents: write
jobs:
  full-install-and-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Static and curl-free bootstrap checks
        run: |
          bash -n install_fast_proxy_v8.sh
          shellcheck -x -S error install_fast_proxy_v8.sh
          docker run --rm ubuntu:24.04 bash -lc 'set -e; ! command -v curl; export DEBIAN_FRONTEND=noninteractive; apt-get update -y >/dev/null; apt-get install -y --no-install-recommends ca-certificates curl >/dev/null; curl -fsSL https://raw.githubusercontent.com/marceldun/cheatcode/main/install_fast_proxy_v8.sh -o /tmp/v8.sh; test -s /tmp/v8.sh; bash -n /tmp/v8.sh'
          curl -4fsSL --connect-timeout 10 --max-time 20 https://ipv4.ping0.cc/geo >/tmp/ping0-geo.txt
          test -n "$(sed -n '2p' /tmp/ping0-geo.txt)"
          curl -4fsSL https://raw.githubusercontent.com/marceldun/cheatcode/main/install_fast_proxy_v8.sh -o /tmp/downloaded-v8.sh
          cmp install_fast_proxy_v8.sh /tmp/downloaded-v8.sh
      - name: Occupy UDP 443
        run: |
          sudo python3 - <<'PY' >/tmp/block443.log 2>&1 &
          import socket,time
          s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); s.bind(('0.0.0.0',443))
          open('/tmp/block443.ready','w').close()
          time.sleep(1500)
          PY
          echo $! >/tmp/block443.pid
          for i in $(seq 1 20); do
            if [ -f /tmp/block443.ready ]; then exit 0; fi
            sleep 0.2
          done
          echo 'UDP 443 blocker did not bind' >&2
          exit 1
      - name: Run complete installer
        run: |
          set +e
          sudo env MEM_KB_OVERRIDE=262144 bash /tmp/downloaded-v8.sh >/tmp/install-v8.log 2>&1
          echo $? >/tmp/install-v8.rc
          exit 0
      - name: Validate HY2-only runtime, naming and recovery
        run: |
          set +e
          report=/tmp/proxy-v8-test-report.txt; : > "$report"; failed=0
          rc=$(cat /tmp/install-v8.rc); echo "complete_install=$rc" >>"$report"; [ "$rc" -eq 0 ] || failed=1
          sudo systemctl is-active --quiet sing-box; rc=$?; echo "service_active=$rc" >>"$report"; [ "$rc" -eq 0 ] || failed=1
          ! sudo systemctl list-unit-files --no-legend | grep -q '^sb-fast-health-v8.timer'; rc=$?; echo "no_external_restart_timer=$rc" >>"$report"; [ "$rc" -eq 0 ] || failed=1
          count=$(sudo jq '.inbounds|length' /etc/sing-box/config.json 2>/dev/null); type=$(sudo jq -r '.inbounds[0].type' /etc/sing-box/config.json 2>/dev/null)
          [ "$count" = 1 ] && [ "$type" = hysteria2 ]; rc=$?; echo "hy2_only_config=$rc" >>"$report"; [ "$rc" -eq 0 ] || failed=1
          ! sudo grep -qiE 'vless|reality|urltest' /etc/sing-box/config.json; rc=$?; echo "no_reality_or_auto_distribution=$rc" >>"$report"; [ "$rc" -eq 0 ] || failed=1
          port=$(sudo jq -r '.inbounds[0].listen_port' /etc/sing-box/config.json); [ "$port" != 443 ]; rc=$?; echo "udp_conflict_auto_avoided=$rc" >>"$report"; [ "$rc" -eq 0 ] || failed=1
          sudo grep -q '^ping0.cc位置：..' /root/sing-box-fast-v8-info.txt; rc=$?; echo "ping0_country_detected=$rc" >>"$report"; [ "$rc" -eq 0 ] || failed=1
          sudo grep -q '节点名称：.* 纯净独享IP' /root/sing-box-fast-v8-info.txt; rc=$?; echo "shadowrocket_name_format=$rc" >>"$report"; [ "$rc" -eq 0 ] || failed=1
          sudo grep -qE '^hysteria2://.*#.*%E7%BA%AF%E5%87%80%E7%8B%AC%E4%BA%ABIP' /root/sing-box-fast-v8-info.txt; rc=$?; echo "encoded_import_link_name=$rc" >>"$report"; [ "$rc" -eq 0 ] || failed=1
          sudo test "$(systemctl is-enabled sb-fast-health-v7.timer 2>/dev/null)" = masked; rc=$?; echo "old_external_probe_masked=$rc" >>"$report"; [ "$rc" -eq 0 ] || failed=1
          pid=$(systemctl show sing-box -p MainPID --value); sudo kill -9 "$pid"
          ok=1; for i in $(seq 1 20); do sleep 1; sudo systemctl is-active --quiet sing-box && { newpid=$(systemctl show sing-box -p MainPID --value); [ "$newpid" != "$pid" ] && { ok=0; break; }; }; done
          echo "real_process_crash_auto_recovers=$ok" >>"$report"; [ "$ok" -eq 0 ] || failed=1
          sed -r 's/\x1B\[[0-9;]*[mK]//g' /tmp/install-v8.log | grep -E '调优等级|连续3次网页测试|小火箭节点名' >>"$report" || true
          if [ "$failed" -eq 0 ]; then echo result=PASS >>"$report"; else echo result=FAIL >>"$report"; tail -180 /tmp/install-v8.log >>"$report"; fi
      - name: Publish report
        if: always()
        run: |
          cp /tmp/proxy-v8-test-report.txt /tmp/TEST_REPORT.txt
          git config user.name github-actions
          git config user.email github-actions@github.com
          git checkout --orphan proxy-v8-test-report
          git rm -rf .
          cp /tmp/TEST_REPORT.txt TEST_REPORT.txt
          git add TEST_REPORT.txt
          git commit -m "Proxy v8 test report $GITHUB_SHA"
          git push --force origin HEAD:proxy-v8-test-report
      - name: Set final result
        if: always()
        run: grep -q '^result=PASS$' /tmp/proxy-v8-test-report.txt
