name: Test REALITY Vision v12 TCP Brutal loss compensation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - install_fast_reality_v12.sh
      - .github/workflows/test-fast-reality-v12.yml
permissions:
  contents: write
jobs:
  full-install-and-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Static and curl-free bootstrap checks
        run: |
          bash -n install_fast_reality_v12.sh
          shellcheck -x -S error install_fast_reality_v12.sh
          docker run --rm ubuntu:24.04 bash -lc 'set -e; ! command -v curl; export DEBIAN_FRONTEND=noninteractive; apt-get update -y >/dev/null; apt-get install -y --no-install-recommends ca-certificates curl >/dev/null; curl -fsSL https://raw.githubusercontent.com/marceldun/cheatcode/main/install_fast_reality_v12.sh -o /tmp/v12.sh; test -s /tmp/v12.sh; bash -n /tmp/v12.sh'
          curl -4fsSL https://raw.githubusercontent.com/marceldun/cheatcode/main/install_fast_reality_v12.sh -o /tmp/downloaded-v12.sh
          cmp install_fast_reality_v12.sh /tmp/downloaded-v12.sh
      - name: Simulate existing HY2 and install v11 baseline
        run: |
          sudo tee /etc/systemd/system/sing-box.service >/dev/null <<'EOF'
          [Unit]
          Description=existing HY2 sentinel
          [Service]
          ExecStart=/usr/bin/sleep infinity
          [Install]
          WantedBy=multi-user.target
          EOF
          sudo systemctl daemon-reload
          sudo systemctl start sing-box
          systemctl show sing-box -p MainPID --value >/tmp/hy2-old.pid
          curl -4fsSL https://raw.githubusercontent.com/marceldun/cheatcode/main/install_fast_reality_v11.sh -o /tmp/v11.sh
          sudo bash /tmp/v11.sh >/tmp/install-v11-baseline.log 2>&1
          sudo systemctl is-active --quiet xray-reality-v11
          sudo cp /etc/xray-reality-v11/state.env /tmp/v11-state.env
          sudo cp /root/xray-reality-v11-info.txt /tmp/v11-info.txt
      - name: Run complete v12 upgrade
        run: |
          set +e
          sudo bash /tmp/downloaded-v12.sh >/tmp/install-v12.log 2>&1
          echo $? >/tmp/install-v12.rc
          exit 0
      - name: Run a two-minute sustained REALITY session
        run: |
          set +e
          sudo timeout 300 bash -c '
            . /etc/xray-reality-v12/state.env
            port=$(jq -r ".inbounds[0].port" /etc/xray-reality-v12/config.json)
            cat >/tmp/v12-soak-client.json <<EOF
          {"log":{"loglevel":"warning"},"inbounds":[{"listen":"127.0.0.1","port":19085,"protocol":"socks","settings":{"auth":"noauth","udp":false}}],"outbounds":[{"protocol":"vless","settings":{"vnext":[{"address":"127.0.0.1","port":$port,"users":[{"id":"$UUID","encryption":"none","flow":"xtls-rprx-vision"}]}]},"streamSettings":{"network":"raw","security":"reality","realitySettings":{"fingerprint":"chrome","serverName":"$REALITY_DOMAIN","password":"$REALITY_PUBLIC","shortId":"$SHORT_ID","spiderX":"/"}}}]}
          EOF
            /etc/xray-reality-v12/xray run -test -config /tmp/v12-soak-client.json || exit 10
            /etc/xray-reality-v12/xray run -config /tmp/v12-soak-client.json >/tmp/v12-soak-client.log 2>&1 &
            cp=$!; trap "kill $cp 2>/dev/null || true" EXIT; sleep 2
            failures=0
            for i in $(seq 1 120); do
              code=$(curl --noproxy "" -sS -o /dev/null -w "%{http_code}" --socks5-hostname 127.0.0.1:19085 --max-time 15 "https://www.gstatic.com/generate_204?v12=$i")
              [ "$code" = 204 ] || failures=$((failures+1))
              sleep 1
            done
            : >/tmp/v12-active-members.txt
            curl --noproxy "" -sS -o /dev/null -w "%{http_code}" --socks5-hostname 127.0.0.1:19085 --max-time 90 "https://speed.cloudflare.com/__down?bytes=33554432&v12=1" >/tmp/v12-first-download.code & dlpid=$!
            member_ok=1
            for i in $(seq 1 20); do
              sleep 1
              brutalctl list | tee -a /tmp/v12-active-members.txt
              members=$(brutalctl list | awk '$1=="0.0.0.0/0"{print $7}')
              [ "${members:-0}" -gt 0 ] && { member_ok=0; break; }
            done
            wait $dlpid || true
            [ "$(cat /tmp/v12-first-download.code)" = 200 ] || failures=$((failures+1))
            echo "$member_ok" >/tmp/v12-active-members.rc
            for i in 2 3; do
              code=$(curl --noproxy "" -sS -o /dev/null -w "%{http_code}" --socks5-hostname 127.0.0.1:19085 --max-time 90 "https://speed.cloudflare.com/__down?bytes=33554432&v12=$i")
              [ "$code" = 200 ] || failures=$((failures+1))
            done
            echo "$failures" >/tmp/v12-soak.failures
            kill $cp 2>/dev/null; wait $cp 2>/dev/null
          '
          test -f /tmp/v12-soak.failures || echo 999 >/tmp/v12-soak.failures
          exit 0
      - name: Validate protocol, coexistence and recovery
        run: |
          set +e
          report=/tmp/reality-v12-test-report.txt; : >"$report"; failed=0
          record(){ echo "$1=$2" >>"$report"; [ "$2" -eq 0 ] || failed=1; }
          rc=$(cat /tmp/install-v12.rc); record complete_install "$rc"
          soak=$(cat /tmp/v12-soak.failures); [ "$soak" -eq 0 ]; record sustained_120_requests_and_96MiB "$?"
          sudo systemctl is-active --quiet xray-reality-v12; record service_active "$?"
          sudo systemctl is-active --quiet reality-v12-brutal; record brutal_parameter_service_active "$?"
          sudo modprobe brutal && sudo test -r /proc/net/tcp_brutal/rules && command -v brutalctl >/dev/null; record tcp_brutal_kernel_module_active "$?"
          [ "$(cat /tmp/v12-active-members.rc 2>/dev/null)" = 0 ]; record real_reality_transfer_has_active_brutal_group_member "$?"
          [ "$(cat /proc/sys/net/ipv4/tcp_congestion_control)" != brutal ]; record brutal_not_unsafe_system_default "$?"
          sudo brutalctl list | awk '$1=="0.0.0.0/0" && $2=="100.00" && $5=="no"{found=1} END{exit !found}'; record global_noroute_rule_isolated_to_brutal_sockets "$?"
          oldpid=$(cat /tmp/hy2-old.pid); newpid=$(systemctl show sing-box -p MainPID --value); sudo systemctl is-active --quiet sing-box && [ "$oldpid" = "$newpid" ]; record existing_hy2_untouched "$?"
          sudo test -f /etc/xray-reality-v11/config.json && sudo test -f /root/xray-reality-v11-info.txt; record v11_files_preserved "$?"
          ! sudo systemctl is-active --quiet xray-reality-v11; record v11_runtime_replaced_without_port_conflict "$?"
          old_uuid=$(sudo sed -n "s/^UUID='\(.*\)'/\1/p" /tmp/v11-state.env); new_uuid=$(sudo sed -n "s/^UUID='\(.*\)'/\1/p" /etc/xray-reality-v12/state.env); [ "$old_uuid" = "$new_uuid" ] && [ -n "$new_uuid" ]; record credentials_preserved "$?"
          old_port=$(sudo sed -n "s/^SAVED_REALITY_PORT='\(.*\)'/\1/p" /tmp/v11-state.env); new_port=$(sudo jq -r '.inbounds[0].port' /etc/xray-reality-v12/config.json); [ "$old_port" = "$new_port" ]; record same_port_preserved "$?"
          protocol=$(sudo jq -r '.inbounds[0].protocol' /etc/xray-reality-v12/config.json); flow=$(sudo jq -r '.inbounds[0].settings.clients[0].flow' /etc/xray-reality-v12/config.json)
          [ "$protocol" = vless ] && [ "$flow" = xtls-rprx-vision ]; record vless_vision_enabled "$?"
          [ "$(sudo jq -r '.inbounds[0].streamSettings.network' /etc/xray-reality-v12/config.json)" = raw ]; record raw_tcp_transport "$?"
          [ "$(sudo jq -r '.inbounds[0].streamSettings.security' /etc/xray-reality-v12/config.json)" = reality ]; record reality_security_enabled "$?"
          [ "$(sudo jq -r '.inbounds[0].streamSettings.sockopt.tcpFastOpen' /etc/xray-reality-v12/config.json)" = true ]; record tcp_fast_open_enabled "$?"
          [ "$(sudo jq -r '.inbounds[0].streamSettings.sockopt.tcpCongestion' /etc/xray-reality-v12/config.json)" = brutal ]; record reality_listener_explicitly_uses_brutal "$?"
          [ "$(sudo jq -r '.policy.levels["0"].bufferSize' /etc/xray-reality-v12/config.json)" = 0 ]; record vision_zero_buffer_policy "$?"
          [ "$(cat /proc/sys/net/ipv4/tcp_notsent_lowat)" = 4294967295 ]; record restrictive_16k_send_limit_removed "$?"
          [ "$(cat /proc/sys/net/core/rmem_max)" -ge 67108864 ]; record expanded_tcp_window "$?"
          sudo systemctl show xray-reality-v12 -p Environment --value | grep -q 'XRAY_RAY_BUFFER_SIZE=0'; record xray_zero_buffer_environment "$?"
          ! sudo systemctl list-unit-files --no-legend | grep -q '^reality-fast-health.*timer'; record no_external_restart_probe "$?"
          sudo grep -q '^ping0.cc位置：..' /root/xray-reality-v12-info.txt; record ping0_country_detected "$?"
          sudo grep -q '节点名称：.* 纯净独享IP' /root/xray-reality-v12-info.txt; record node_name_format "$?"
          sudo grep -q 'TCP Brutal v2.0.1 / 目标 100Mbps' /root/xray-reality-v12-info.txt; record brutal_rate_recorded "$?"
          sudo grep -q '^vless://' /root/xray-reality-v12-info.txt && sudo grep -q 'security=reality' /root/xray-reality-v12-info.txt && sudo grep -q 'flow=xtls-rprx-vision' /root/xray-reality-v12-info.txt; record import_link_complete "$?"
          sudo brutalctl add 192.0.2.1/32 100 gain=20 >/dev/null && sudo brutalctl list | grep -Fq '192.0.2.1/32'; rule_rc=$?; sudo brutalctl del 192.0.2.1/32 >/dev/null 2>&1; record real_brutal_rule_add_list_delete "$rule_rc"
          pid=$(systemctl show xray-reality-v12 -p MainPID --value 2>/dev/null); ok=1
          if [[ "$pid" =~ ^[0-9]+$ ]] && [ "$pid" -gt 1 ]; then
            sudo kill -9 "$pid"
            for i in $(seq 1 20); do sleep 1; sudo systemctl is-active --quiet xray-reality-v12 && { np=$(systemctl show xray-reality-v12 -p MainPID --value); [ "$np" != "$pid" ] && [ "$np" -gt 1 ] && { ok=0; break; }; }; done
          fi
          record real_process_crash_auto_recovers "$ok"
          echo "v11_32MiB=$(sudo awk -F'持续下载 ' '/32MB测试/{print $2}' /tmp/v11-info.txt)" >>"$report"
          echo "v12_32MiB=$(sudo awk -F'持续下载 ' '/32MB测试/{print $2}' /root/xray-reality-v12-info.txt)" >>"$report"
          echo 'active_brutal_members_during_32MiB_begin' >>"$report"
          cat /tmp/v12-active-members.txt >>"$report" 2>/dev/null || true
          echo 'active_brutal_members_during_32MiB_end' >>"$report"
          sed -r 's/\x1B\[[0-9;]*[mK]//g' /tmp/install-v12.log | grep -E '官方内核已校验|TCP Brutal规则生效|小火箭节点名' >>"$report" || true
          if [ "$failed" -eq 0 ]; then echo result=PASS >>"$report"; else echo result=FAIL >>"$report"; tail -240 /tmp/install-v12.log >>"$report"; fi
      - name: Publish report
        if: always()
        run: |
          cp /tmp/reality-v12-test-report.txt /tmp/TEST_REPORT.txt
          git config user.name github-actions
          git config user.email github-actions@github.com
          git checkout --orphan reality-v12-test-report
          git rm -rf .
          cp /tmp/TEST_REPORT.txt TEST_REPORT.txt
          git add TEST_REPORT.txt
          git commit -m "REALITY v12 test report $GITHUB_SHA"
          git push --force origin HEAD:reality-v12-test-report
      - name: Set final result
        if: always()
        run: grep -q '^result=PASS$' /tmp/reality-v12-test-report.txt
