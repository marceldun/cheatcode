name: Temporary VPS connectivity probe
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/probe-vps-connectivity.yml
jobs:
  ssh-port-22-open:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: timeout 12 bash -c '</dev/tcp/38.126.114.219/22'
  web-port-80-open:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: timeout 12 bash -c '</dev/tcp/38.126.114.219/80'
  https-port-443-open:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: timeout 12 bash -c '</dev/tcp/38.126.114.219/443'
  alternate-port-8080-open:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: timeout 12 bash -c '</dev/tcp/38.126.114.219/8080'
