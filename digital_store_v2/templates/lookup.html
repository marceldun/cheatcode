{% extends 'base.html' %}{% block title %}订单查询{% endblock %}{% block content %}<div class="panel narrow"><h1>查询历史订单</h1><p>三项同时匹配才会显示交付内容，避免邮箱泄露导致商品被盗。</p><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>购买邮箱<input type="email" name="email" required></label><label>订单号<input name="order_id" required></label><label>查询码<input name="lookup_code" required></label><button>立即查询</button></form>{% if result %}<hr><h2>{{result.name}}</h2><p>状态：{{result.status}}</p>{% if delivery %}<div class="delivery"><pre>{{delivery}}</pre></div>{% endif %}{% endif %}</div>{% endblock %}
