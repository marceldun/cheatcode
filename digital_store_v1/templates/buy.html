{% extends 'base.html' %}{% block title %}购买 {{product.name}}{% endblock %}{% block content %}
<div class="panel narrow"><a class="back" href="{{url_for('index')}}">← 返回商品</a><span class="category">{{product.category}}</span><h1>{{product.name}}</h1><p>{{product.description}}</p><div class="price">¥{{ '%.2f'|format(product.price_cents/100) }}</div>
<form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>接收订单的邮箱<input type="email" name="email" required autocomplete="email" placeholder="name@example.com"></label><label>付款方式<select name="payment_method"><option value="alipay">支付宝</option><option value="wechat">微信支付</option></select></label><button>创建订单</button></form><p class="hint">订单查询需要邮箱、订单号和查询码，防止别人仅凭邮箱看到你的购买内容。</p></div>{% endblock %}
