{% extends 'base.html' %}{% block title %}购买 {{product.name}}{% endblock %}{% block content %}
<div class="panel narrow"><a class="back" href="{{url_for('index')}}">← 返回商品</a><span class="category">{{product.category}}</span><h1>{{product.name}}</h1><p>{{product.description}}</p><div class="price">¥{{ '%.2f'|format(product.price_cents/100) }}</div>
<form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>邮箱或手机号<input name="contact" required autocomplete="email" placeholder="用于查询本人的历史订单"></label><label>付款方式<select name="payment_method"><option value="alipay">支付宝</option><option value="wechat">微信支付</option></select></label><button>下单并显示付款二维码</button></form><p class="hint">付款成功后当前页面自动刷新并显示交付内容。以后只需邮箱或手机号即可查询订单状态。</p></div>{% endblock %}
